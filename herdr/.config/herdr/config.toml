# herdr configuration — ported from ~/.dotfiles/tmux/.tmux.conf

onboarding = false

[theme]
# tmux: set -g @plugin 'rose-pine/tmux' + @rose_pine_variant 'main'
name = "rose-pine"

auto_switch = false
[terminal]
# tmux: default-terminal / terminal-overrides are handled by herdr itself
new_cwd = "follow"

[keys]
# tmux: unbind C-b ; set-option -g prefix C-a
prefix = "ctrl+a"

# tmux: bind r source-file ~/.tmux.conf
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# tmux: bind-key a last-window / bind -r ^ last-window are served by the
# herdr-last-window command below, and prefix+shift+l by herdr-last-space.
# herdr has neither a last_tab nor a last_workspace action, so both read focus
# history from the herdr-focus-tracker service.
#
# tmux: prefix+; last-pane. last_pane is herdr's one built-in back-and-forth and
# it is global -- the stored pane id is workspace-qualified, so it can cross
# spaces and tabs. Keeping it on its tmux key leaves prefix+a for last-window.
last_pane = "prefix+semicolon"

# tmux: prefix+p ran the fzf pane/session switcher, so prefix+p is the
# native workspace picker here and previous_tab stays unbound
workspace_picker = "prefix+p"
previous_tab = ""
next_tab = "prefix+n"
goto = "prefix+g"

new_tab = "prefix+c"
close_tab = "prefix+shift+x"
rename_tab = "prefix+shift+t"
switch_tab = "prefix+1..9"

rename_workspace = "prefix+shift+w"
# moved off their herdr defaults so the tmux capital-letter popups keep
# their keys: prefix+shift+n (fzf home) and prefix+shift+d (dotfiles)
new_workspace = "prefix+shift+o"
close_workspace = "prefix+shift+q"

# Spaces panel. Space cycling lives on ctrl+alt, the only modifier family herdr
# documents as terminal-safe.
switch_workspace = "prefix+shift+1..9"
previous_workspace = "ctrl+alt+k"
next_workspace = "ctrl+alt+j"

# Agents panel: cycle the attention queue, jump by ctrl+alt+1..9 below
next_agent = ["prefix+tab", "ctrl+alt+n"]
previous_agent = ["prefix+shift+tab", "ctrl+alt+p"]

# tmux: vim-like pane switching (bind -r h/j/k/l select-pane)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
# panes are reachable directionally above and via last_pane, so prefix+tab
# is spent on the agent attention queue instead of pane cycling
cycle_pane_next = ""
cycle_pane_previous = ""

# swap_pane_left/down/up/right are configurable but left unbound: .tmux.conf never
# bound swap, and the vim-capital family is already spent on the tmux popups
# (prefix+shift+k the director, prefix+shift+d the dotfiles jump).

# tmux defaults: prefix+% split-window -h (side by side) = herdr "split right",
# prefix+" split-window -v (stacked) = herdr "split down". Both tmux keys are
# kept alongside herdr's own prefix+v / prefix+minus.
split_vertical = ["prefix+v", "prefix+%"]
split_horizontal = ["prefix+minus", 'prefix+"']
close_pane = "prefix+x"
zoom = "prefix+z"
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"

# tmux: set-window-option -g mode-keys vi + prefix+[ enters copy mode.
# The vi selection binds (v begin-selection, y copy-pipe wl-copy) have no config
# surface here; herdr copies to the system clipboard itself, see ui.copy_on_select.
copy_mode = "prefix+["

# Navigate mode (prefix+g): j/k walk the Spaces list like a vim buffer,
# arrows take over vertical pane movement. Left/right arrows are hardcoded
# aliases for h/l, so panes keep all four directions.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"
navigate_pane_left = "h"
navigate_pane_right = "l"

toggle_sidebar = "prefix+b"
detach = "prefix+q"
help = "prefix+?"
settings = "prefix+s"

# ctrl+alt+1..9 focuses agent rows directly, no prefix
[keys.indexed]
agents = "ctrl+alt"

# tmux: bind-key a last-window / bind -r ^ last-window
# Toggles the previous tab inside the active space.
[[keys.command]]
key = ["prefix+a", "prefix+^"]
type = "plugin_action"
command = "mrgeek.last-focus.last-window"

# Toggles the previous space. tmux had no session-level equivalent bound.
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "mrgeek.last-focus.last-space"

# tmux: bind-key -r f display-popup -E "~/.local/bin/tmux-sessionizer"
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "$HOME/.local/bin/herdr-sessionizer"
width = "80%"
height = "80%"

# tmux: bind-key -r D run-shell "~/.local/bin/tmux-sessionizer ~/.dotfiles"
[[keys.command]]
key = "prefix+shift+d"
type = "shell"
command = "$HOME/.local/bin/herdr-sessionizer $HOME/.dotfiles"

# tmux: bind-key -r K display-popup -E "~/.local/bin/tmux-director"
[[keys.command]]
key = "prefix+shift+k"
type = "popup"
command = "$HOME/.local/bin/herdr-director"
width = "80%"
height = "80%"

# tmux: bind-key -r N display-popup -E "~/.tmux-scripts/fzf-home"
[[keys.command]]
key = "prefix+shift+n"
type = "popup"
command = "$HOME/.local/bin/herdr-home"
width = "80%"
height = "80%"

# tmux: bind-key -r F display-popup -E "~/.local/bin/tmux-runs 'common-commands'"
[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "$HOME/.local/bin/herdr-runs common-commands"
width = "80%"
height = "80%"

# tmux: bind-key -r i run-shell "tmux neww tmux-cht"
[[keys.command]]
key = "prefix+i"
type = "popup"
command = "$HOME/.local/bin/herdr-cht"
width = "80%"
height = "80%"

[ui]
# tmux: set -g status-style 'bg=#333333 fg=#5eacd3'
accent = "#5eacd3"
pane_outer_borders = false
copy_on_select = true
confirm_close = true

agent_panel_sort = "spaces"

# This box is headless and reached over SSH, so `system` notifications (and the
# notify-send the herdr-* scripts call) have nowhere to render. `terminal` emits
# an OSC 777/9 notification that the *outer* terminal on your laptop shows, so
# agent done/blocked alerts survive the SSH hop.
[ui.toast]
delivery = "terminal"
delay_seconds = 1

[session]
# tmux: tmux-resurrect + tmux-continuum
resume_agents_on_restore = true

[experimental]
pane_history = true

# Agent worktrees. `New worktree` on a Git space checks out under
# <directory>/<repo>/<branch-slug> and opens it as a grouped child workspace, so
# each agent gets an isolated checkout instead of fighting over one working tree.
[worktrees]
directory = "~/.herdr/worktrees"

[advanced]
scrollback_limit_bytes = 10000000

# Agents here often run with nobody attached (Hermes drives them over the socket
# while you are away). The default headless canvas is 120x40, which makes agent
# TUIs wrap badly and truncates what `pane read` can recover. Give the detached
# server a roomier virtual terminal.
[server]
headless_cols = 200
headless_rows = 50

# Not portable from .tmux.conf:
#   bind-key C-a send-prefix — no config needed, herdr sends a literal prefix key
#     when the prefix is pressed twice, and rejects prefix+<prefix> as reserved.
#   bind -n M-c clear-history — herdr exposes no clear-scrollback action or API
#     method, so there is nothing to bind. Scrollback is capped by
#     advanced.scrollback_limit_bytes above instead.
#   bind-key -T copy-mode-vi v/y — copy mode has no per-key config surface;
#     ui.copy_on_select handles selection to system clipboard.
#   set -g base-index 1 — herdr tabs and spaces are already 1-indexed.
#   default-terminal / terminal-overrides (Tc, Smulx, Setulc) — herdr negotiates
#     truecolor and underline styling with the host terminal itself.
